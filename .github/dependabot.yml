version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for all minor/patch bumps instead of one per package; majors stay separate.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @angular/build 22.x requires TypeScript >=6.0 <6.1, so 7.x can't be installed.
      # Remove once the Angular version in use supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
