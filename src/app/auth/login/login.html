<h2>Log In</h2>

<p>You're looking at a live demo — feel free to add, edit, or delete products.</p>

<button type="button" (click)="loginAsDemo()" [disabled]="submitting()">
  {{ submitting() ? 'Signing in...' : 'Sign in as demo user' }}
</button>
<p class="demo-credentials">Demo credentials: {{ demoEmail }} / {{ demoPassword }}</p>

<hr />

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div>
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      [attr.aria-invalid]="showError('email') ? 'true' : null"
      [attr.aria-describedby]="showError('email') ? 'email-error' : null"
    />
    @if (showError('email')) {
      <span id="email-error" class="field-error">A valid email is required.</span>
    }
  </div>

  <div>
    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      [attr.aria-invalid]="showError('password') ? 'true' : null"
      [attr.aria-describedby]="showError('password') ? 'password-error' : null"
    />
    @if (showError('password')) {
      <span id="password-error" class="field-error">Password is required.</span>
    }
  </div>

  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }

  <button type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Logging in...' : 'Log In' }}
  </button>
</form>
